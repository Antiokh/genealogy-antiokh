name: Fix mourning ribbon geometry

on:
  push:
    branches:
      - fix/mourning-ribbon-overflow

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mourning-ribbon-overflow
      - name: Patch ribbon CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/GenealogyPageTitle.astro')
          s = p.read_text()
          start = s.index('  .person-portrait__mourning-ribbon {')
          end = s.index('\n  }', start) + len('\n  }')
          block = s[start:end]
          block = block.replace('right: -10%;', 'right: -18%;')
          block = block.replace('bottom: 12%;', 'bottom: 11%;')
          block = block.replace('width: 48%;', 'width: 82%;')
          block = block.replace('transform: rotate(-42deg);', 'transform: rotate(-42deg);\n    transform-origin: 50% 50%;')
          p.write_text(s[:start] + block + s[end:])
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GenealogyPageTitle.astro
          git commit -m "Fix mourning ribbon coverage"
          git push origin HEAD:fix/mourning-ribbon-overflow
