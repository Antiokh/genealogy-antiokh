name: Fix mourning ribbon geometry

on:
  push:
    branches:
      - fix/mourning-ribbon-overflow

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mourning-ribbon-overflow
      - name: Patch ribbon CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/GenealogyPageTitle.astro')
          s = p.read_text()
          old = '''  .person-portrait__mourning-ribbon {
            position: absolute;
            z-index: 3;
            right: -10%;
            bottom: 12%;
            width: 48%;
            height: 0.55rem;
            background: rgba(10, 10, 10, 0.96);
            transform: rotate(-42deg);
            pointer-events: none;
          }'''
          new = '''  .person-portrait__mourning-ribbon {
            position: absolute;
            z-index: 3;
            right: -18%;
            bottom: 11%;
            width: 82%;
            height: 0.55rem;
            background: rgba(10, 10, 10, 0.96);
            transform: rotate(-42deg);
            transform-origin: 50% 50%;
            pointer-events: none;
          }'''
          if old not in s:
              raise SystemExit('Expected mourning-ribbon block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GenealogyPageTitle.astro
          git commit -m "Fix mourning ribbon coverage"
          git push origin HEAD:fix/mourning-ribbon-overflow
