name: Migrate person summaries

on:
  push:
    branches:
      - feat/structured-person-header

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/structured-person-header
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: node scripts/strip-person-derived-body.mjs
      - name: Commit migrated person bodies
        run: |
          if git diff --quiet; then
            echo "No person bodies needed migration."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/people
          git commit -m "Migrate person pages to structured frontmatter summary"
          git push origin HEAD:feat/structured-person-header
