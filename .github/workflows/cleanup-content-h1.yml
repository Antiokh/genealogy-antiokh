name: Cleanup duplicate content H1

on:
  push:
    branches:
      - fix/remove-duplicate-content-h1

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-duplicate-content-h1
      - name: Normalize body H1 headings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'src/content/docs';
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (/\.(md|mdx)$/i.test(entry.name)) files.push(p);
            }
          }
          walk(root);

          function normalizeText(s) {
            return s
              .replace(/^['"]|['"]$/g, '')
              .replace(/[`*_]/g, '')
              .replace(/\s+/g, ' ')
              .trim()
              .toLocaleLowerCase('ru');
          }

          const changed = [];
          let removed = 0;
          let demoted = 0;
          const details = [];

          for (const file of files) {
            const original = fs.readFileSync(file, 'utf8');
            const lines = original.split(/\r?\n/);
            let frontmatter = false;
            let frontmatterDone = false;
            let fence = null;
            let title = '';
            let touched = false;
            const out = [];

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];

              if (i === 0 && line.trim() === '---') {
                frontmatter = true;
                out.push(line);
                continue;
              }
              if (frontmatter) {
                const m = line.match(/^title:\s*(.+?)\s*$/);
                if (m && !title) title = m[1].trim();
                if (line.trim() === '---') {
                  frontmatter = false;
                  frontmatterDone = true;
                }
                out.push(line);
                continue;
              }

              const fenceMatch = line.match(/^\s*(```+|~~~+)/);
              if (fenceMatch) {
                const marker = fenceMatch[1][0];
                if (!fence) fence = marker;
                else if (fence === marker) fence = null;
                out.push(line);
                continue;
              }

              if (!fence && frontmatterDone) {
                const h1 = line.match(/^#\s+(.+?)\s*$/);
                if (h1) {
                  const heading = h1[1].trim();
                  touched = true;
                  if (title && normalizeText(heading) === normalizeText(title)) {
                    removed++;
                    details.push(`REMOVE ${file}:${i + 1} :: ${heading}`);
                    // Avoid leaving a second consecutive blank line after removed title.
                    continue;
                  }
                  demoted++;
                  details.push(`DEMOTE ${file}:${i + 1} :: ${heading}`);
                  out.push(`## ${heading}`);
                  continue;
                }
              }

              out.push(line);
            }

            if (touched) {
              let next = out.join('\n');
              // Collapse excessive blank space introduced by deleting a duplicate title.
              next = next.replace(/(---\n)\n\n+/g, '$1\n');
              if (original.endsWith('\n') && !next.endsWith('\n')) next += '\n';
              if (next !== original) {
                fs.writeFileSync(file, next);
                changed.push(file);
              }
            }
          }

          console.log(`Scanned ${files.length} Markdown/MDX files.`);
          console.log(`Changed ${changed.length} files; removed ${removed} duplicate H1; demoted ${demoted} non-title H1.`);
          for (const d of details) console.log(d);
          NODE

          git diff --check
          git status --short

          if git diff --quiet; then
            echo "No body H1 headings found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs
          git commit -m "Remove duplicate content H1 headings"
          git push origin HEAD:fix/remove-duplicate-content-h1
