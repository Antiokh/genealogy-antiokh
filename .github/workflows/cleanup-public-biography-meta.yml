name: Cleanup public biography meta prose

on:
  push:
    branches:
      - fix/public-biography-meta-prose

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-biography-meta-prose
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: node scripts/cleanup-public-biography-meta-once.mjs
      - name: Commit cleaned biographies
        run: |
          if git diff --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/people/1880-1889/vladimir-bush.md src/content/docs/people/1900-1909/nikolay-kurochkin.md
          git commit -m "Remove editorial meta prose from public biographies"
          git push origin HEAD:fix/public-biography-meta-prose
      - run: node scripts/check-public-biography-prose.mjs
