name: Starlight

on:
  push:
    branches:
      - main
      - starlight-encyclopedia
      - feat/add-family-favicon
  pull_request:

permissions:
  contents: write

jobs:
  assemble-favicon:
    if: github.ref_name == 'feat/add-family-favicon' || github.head_ref == 'feat/add-family-favicon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Assemble favicon
        shell: bash
        run: |
          cat tmp/favicon/part-*.b64 | base64 --decode | gzip --decompress > public/favicon.svg
          test "$(sha256sum public/favicon.svg | cut -d' ' -f1)" = "d3fb4319c09b09d33d8b7e474611910ed1c579e46a1d62f4455b4764d04dc47c"
      - name: Commit favicon
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.svg
          git diff --cached --quiet && exit 0
          git commit -m "Add family tree favicon"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install
      - run: npm run check
      - run: npm run build
