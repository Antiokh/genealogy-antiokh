name: Starlight

on:
  push:
    branches:
      - main
      - starlight-encyclopedia
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm install
      - run: npm run check
      - run: npm run build
