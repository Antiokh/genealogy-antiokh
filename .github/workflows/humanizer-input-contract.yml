name: Контракт Humanizer Russian

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/humanizer_pr_review.py'
      - '.github/scripts/test_humanizer_pr_publish.cjs'
      - '.github/workflows/humanizer-*.yml'
      - 'docs/HUMANIZER_REVIEW.md'
  pull_request:
    paths:
      - '.github/scripts/humanizer_pr_review.py'
      - '.github/scripts/test_humanizer_pr_publish.cjs'
      - '.github/workflows/humanizer-*.yml'
      - 'docs/HUMANIZER_REVIEW.md'

permissions:
  contents: read

env:
  HUMANIZER_SHA: 81af17bcb18ae9364a9f94f4e2f849a68d3b1eee

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test adapter syntax
        run: python3 -m py_compile .github/scripts/humanizer_pr_review.py
      - name: Fetch pinned Russian editorial engine
        run: |
          git init /tmp/humanizer_russian
          git -C /tmp/humanizer_russian remote add origin https://github.com/Antiokh/humanizer_russian.git
          git -C /tmp/humanizer_russian fetch --depth=1 origin "$HUMANIZER_SHA"
          git -C /tmp/humanizer_russian checkout --detach FETCH_HEAD
          test "$(git -C /tmp/humanizer_russian rev-parse HEAD)" = "$HUMANIZER_SHA"
      - name: Test biography prose isolation and reviewer API
        run: |
          python3 .github/scripts/humanizer_pr_review.py \
            --humanizer-root /tmp/humanizer_russian \
            --self-test > /tmp/humanizer-selftest.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/humanizer-selftest.json', encoding='utf-8'))
          assert data['mode'] == 'editorial_board'
          assert data['style'] == 'neutral'
          assert data['scope'] == 'whole_article'
          assert data['frontmatter_excluded'] is True
          assert data['editor_count'] == 8
          print('Russian biography editorial contract: OK')
          PY
      - name: Test inline review publication and main refresh
        run: node .github/scripts/test_humanizer_pr_publish.cjs
