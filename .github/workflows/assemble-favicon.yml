name: Assemble favicon

on:
  push:
    branches:
      - feat/add-family-favicon
    paths:
      - 'tmp/favicon/**'
      - '.github/workflows/assemble-favicon.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble favicon
        shell: bash
        run: |
          cat tmp/favicon/part-*.b64 | base64 --decode | gzip --decompress > public/favicon.svg
          test "$(sha256sum public/favicon.svg | cut -d' ' -f1)" = "23ec4b3108e3a4c1423178964b13e614ecc06bc6f58a6cfe778bac2f9a1309f8"
      - name: Commit favicon
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.svg
          git diff --cached --quiet && exit 0
          git commit -m "Add family tree favicon"
          git push
