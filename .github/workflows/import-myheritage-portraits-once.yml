name: Attach MyHeritage person portraits once

on:
  push:
    branches:
      - fix/myheritage-person-portraits

permissions:
  contents: write

jobs:
  portraits:
    if: ${{ !contains(github.event.head_commit.message, '[portraits-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/myheritage-person-portraits
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Attach imported media to people
        run: node scripts/attach-myheritage-portraits.mjs

      - name: Commit generated portraits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/people imports/myheritage-2026/portrait-attachment-report.json
          if git diff --cached --quiet; then
            echo "No portrait changes to commit."
            exit 0
          fi
          git commit -m "Attach MyHeritage media as person portraits [portraits-generated]"
          git push origin HEAD:fix/myheritage-person-portraits
