name: Bootstrap media

on:
  push:
    branches:
      - media-gallery-photoswipe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media-gallery-photoswipe
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: node scripts/bootstrap-vladimir-bush-media.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/people/1880-1889/vladimir-bush.md src/content/docs/media/1880-1889/vladimir-bush-portrait.md
          if git diff --cached --quiet; then
            echo "No media changes"
          else
            git commit -m "Link Vladimir Bush portrait media"
            git push origin HEAD:media-gallery-photoswipe
          fi
