name: GitHub Pages (static public mirror)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep production publication independent from PR validation.
  # PRs and non-main manual runs get their own ref-specific groups.
  group: genealogy-pages-${{ github.ref == 'refs/heads/main' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate static site for Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install and build
        env:
          GENEALOGY_SITE_URL: ${{ vars.GENEALOGY_PAGES_SITE_URL || 'https://antiokh.github.io' }}
          GENEALOGY_SITE_BASE: ${{ vars.GENEALOGY_PAGES_SITE_BASE || '/genealogy-antiokh/' }}
        run: |
          npm install --no-audit --no-fund --progress=false
          npm run check
          npm run build
      - name: Upload static output, not repository source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_GENEALOGY_GH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish static mirror
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_GENEALOGY_GH_PAGES == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
